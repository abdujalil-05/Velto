# /etc/tmpfiles.d/velto.conf   (systemd-tmpfiles --create /etc/tmpfiles.d/velto.conf)
# type path                    mode user    group        age
d /etc/velto                   0755 root    root         -
d /var/backups/velto           0750 root    velto-deploy -
d /var/lib/velto-backup        0755 root    root         -
d /var/lib/velto               0750 velto   velto        -
# velto-monitor's own state dir (/var/lib/velto-monitor) is created per deploy/monitoring/README.md
