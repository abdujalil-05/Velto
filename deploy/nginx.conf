# Velto — auto-message.uz/velto ostidagi joylashuv bloklari.
#
# ⚠️ Bu fayl mustaqil `server { }` bloki EMAS — mavjud auto-message.uz
# serveriga qo'shiladigan snippet. O'rnatish:
#
#   cp deploy/nginx.conf /etc/nginx/snippets/velto.conf
#   # /etc/nginx/sites-available/auto-message.uz ichidagi 443 server blokiga
#   # (SPA fallback `location /` dan OLDIN) bitta qator qo'shiladi:
#   #     include /etc/nginx/snippets/velto.conf;
#   nginx -t && systemctl reload nginx
#
# Natija — hammasi bitta domen, bitta TLS sertifikati ostida:
#
#   https://auto-message.uz/velto/       → back-office (Next.js, 127.0.0.1:3100)
#   https://auto-message.uz/velto/api/   → NestJS API   (127.0.0.1:3101)
#   https://auto-message.uz/velto/app/   → Telegram Mini App (127.0.0.1:3102)
#   https://auto-message.uz/velto-files/ → MinIO obyektlari (127.0.0.1:9000)
#
# Prefiks (`/velto`) muhim va REGISTRGA SEZGIR: Next.js ilovalari
# NEXT_PUBLIC_BASE_PATH bilan aynan shu qiymat ostida build qilingan
# (apps/{web,miniapp}/.env.production.local). Prefiksni o'zgartirsangiz —
# .env.production.local va qayta build kerak.
#
# Jarayonlar pm2 ostida: deploy/ecosystem.config.js.

# Kanonik manzil — OXIRIDAGI "/" BILAN. Next basePath ostida yalang'och
# "/velto" ni striplab bo'sh yo'l hosil qiladi va next-intl middleware'i unga
# tegmaydi (404); "/velto/" esa "/" bo'lib normal ishlaydi. Shu sababli
# ilovalarda skipTrailingSlashRedirect yoqilgan (next.config.mjs).
location = /velto      { return 301 /velto/; }
location = /velto/app  { return 301 /velto/app/; }

# Eski deploy `/Velto` (bosh harf bilan) da edi va u boshqa kod bazasi.
# Saqlangan xatcho'plar/Telegram tugmalari yangi manzilga yo'naltiriladi.
# Ichki yo'llar ko'chirilmaydi — eski ilovaning route'lari bu yerda mavjud emas.
location = /Velto      { return 301 /velto/; }
location ^~ /Velto/    { return 301 /velto/; }

# ---------------------------------------------------------------------------
# API (NestJS)
# ---------------------------------------------------------------------------
# proxy_pass oxiridagi "/" prefiksni olib tashlaydi:
#   /velto/api/auth/login → 127.0.0.1:3101/auth/login
# Web ilova bilan bir xil origin, shuning uchun brauzerga CORS kerak emas.
location /velto/api/ {
    proxy_pass http://127.0.0.1:3101/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # API `trust proxy: loopback` bilan ishlaydi (.env: TRUST_PROXY=true) —
    # aks holda throttler 120 so'rov/min limitini hamma uchun BITTA
    # 127.0.0.1 chelagida sanardi va AuditLog.ip doim 127.0.0.1 bo'lardi.

    # Refresh token cookie'si backendda Path=/auth bilan qo'yiladi
    # (auth.controller.ts). Brauzer uchun yo'l prefiks bilan bo'lishi kerak,
    # aks holda cookie /velto/api/auth/refresh ga QAYTARILMAYDI va sessiya
    # 15 daqiqada uziladi.
    proxy_cookie_path /auth /velto/api/auth;

    # Excel import (mahsulot/mijoz ro'yxatlari) server darajasidagi 15m dan
    # katta bo'lishi mumkin.
    client_max_body_size 50m;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

# ---------------------------------------------------------------------------
# Telegram Mini App (sotuv agentlari)
# ---------------------------------------------------------------------------
# basePath=/velto/app bilan build qilingan — URI O'ZGARTIRILMAYDI
# (proxy_pass oxirida "/" YO'Q), Next o'zi to'liq yo'lni kutadi.
location /velto/app/ {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
}

# ---------------------------------------------------------------------------
# Back-office (Next.js SSR)
# ---------------------------------------------------------------------------
# basePath=/velto — bu yerda ham URI o'zgartirilmaydi. /velto/_next/... statik
# aktivlari ham shu blok orqali o'tadi (Next ularga o'zi immutable Cache-Control
# qo'yadi, shuning uchun alohida location kerak emas).
location /velto/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rasm yuklash formalari.
    client_max_body_size 50m;

    proxy_read_timeout 60s;
}

# ---------------------------------------------------------------------------
# Obyekt saqlash (MinIO) — mahsulot rasmlari, 1C eksport fayllari
# ---------------------------------------------------------------------------
# StorageService qaytaradigan public URL — `${S3_ENDPOINT}/${S3_BUCKET}/${key}`
# (storage.service.ts, imzolanmagan/plain URL), ya'ni
# https://auto-message.uz/velto-files/... . Bucket nomi = yo'l prefiksi
# bo'lgani uchun nginx yo'lni O'ZGARTIRMASLIGI shart: SigV4 imzosi so'rov
# yo'li VA Host sarlavhasi ustidan hisoblanadi — API ham aynan shu manzil
# orqali yozadi (S3_ENDPOINT=https://auto-message.uz), prefiks kesilsa yoki
# Host almashtirilsa MinIO 403 qaytaradi.
location /velto-files/ {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 50m;
    proxy_buffering off;
    proxy_request_buffering off;

    # Yuklangan faylning Content-Type'i brauzer tomonidan qayta "taxmin"
    # qilinmasin: bucket anonim o'qishga ochiq, shu domenda esa boshqa
    # ilovalar ham bor — sniffing tufayli obyekt HTML sifatida talqin qilinsa
    # bu saqlangan XSS bo'lardi. Yuklashda magic-byte tekshiruvi bor
    # (catalog/products/image-validation.ts, SVG taqiqlangan), bu — ikkinchi qatlam.
    add_header X-Content-Type-Options nosniff always;
}
