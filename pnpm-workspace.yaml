packages:
  - "apps/*"
  - "packages/*"

engineStrict: true

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.67.0'
  - '@typescript-eslint/parser@8.67.0'
  - '@typescript-eslint/project-service@8.67.0'
  - '@typescript-eslint/scope-manager@8.67.0'
  - '@typescript-eslint/tsconfig-utils@8.67.0'
  - '@typescript-eslint/type-utils@8.67.0'
  - '@typescript-eslint/types@8.67.0'
  - '@typescript-eslint/typescript-estree@8.67.0'
  - '@typescript-eslint/utils@8.67.0'
  - '@typescript-eslint/visitor-keys@8.67.0'
  - typescript-eslint@8.67.0

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@swc/core"
  - esbuild
  - prisma

overrides:
  # GHSA-x5fp-wj9c-mxmx, -4mjr-xmp4-gh2g, -q8mj, -6pq8: qs<6.16 via express 4.22.1 (pinned by @nestjs/platform-express 10.4.22)
  express@4: 4.22.3
  # GHSA-q7qp-rjg7-q26m: Nest 10 has no fixed release
  multer: ^2.5.0
  # GHSA-27r3-jxmh-p828: Nest 10 has no fixed release
  body-parser@1: ^1.20.9
  lodash: ^4.17.24
  postcss: ^8.5.23
  deepmerge-ts: ^8.0.2
