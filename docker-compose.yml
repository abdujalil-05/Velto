name: velto

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # `velto` is the bootstrap SUPERUSER — admin only (provisioning). The
      # app connects as velto_app, migrations as velto_owner (see
      # packages/database/scripts/provision-roles.sql, run on first init).
      POSTGRES_USER: velto
      POSTGRES_PASSWORD: velto
      POSTGRES_DB: velto_dev
    ports:
      - "5433:5432"
    volumes:
      - velto_postgres_data:/var/lib/postgresql/data
      - ./packages/database/scripts/provision-roles.sql:/docker-entrypoint-initdb.d/10-provision-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - velto_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: velto
      MINIO_ROOT_PASSWORD: velto12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - velto_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  velto_postgres_data:
  velto_redis_data:
  velto_minio_data:
